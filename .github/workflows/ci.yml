name: SixSeven CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift Package tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run SwiftPM tests
        run: swift test

  ios-simulator:
    name: iOS Simulator tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone .* \([A-F0-9-]{36}\)' \
            | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          echo "Using simulator: $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and test native app
        run: >-
          xcodebuild
          -project SixSeven.xcodeproj
          -scheme SixSeven
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/SixSevenDerivedData"
          test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixseven-xcresult
          path: ${{ runner.temp }}/SixSevenDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
